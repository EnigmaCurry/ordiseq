[package]
name = "scale_omnibus"
version = "0.1.2"
edition = "2021"
description = "A library of musical scales"
repository = "https://github.com/EnigmaCurry/ordiseq"
homepage = "https://github.com/EnigmaCurry/ordiseq"
license = "MIT"
documentation = "https://docs.rs/scale_omnibus"

[dependencies]
serde = { version = "1.0.216", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = { version = "1", optional = true }
thiserror = "2.0.9"
clap = { version = "4", features = ["derive"], optional = true }

[features]
cli = ["clap", "serde_json"]

[[bin]]
name = "scale_omnibus"
required-features = ["cli"]
