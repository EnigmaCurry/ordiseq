[package]
name = "ordiseq_app"
version = "0.1.0"
edition = "2021"
description = "Cross-platform GUI app for ordiseq MIDI sequencer"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-drag = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ordiseq = { path = "../ordiseq", features = ["synth"] }
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
