name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

  build-app-and-plugins:
    name: Build ${{ matrix.platform }} (${{ matrix.target }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: x86_64
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            arch: arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_name: macos
            arch: x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: ${{ matrix.target }}-release

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libasound2-dev

      - name: Install frontend dependencies
        run: |
          cd ordiseq_app/frontend
          npm install

      - name: Install Tauri CLI
        run: |
          cd ordiseq_app
          npm install

      - name: Build Tauri app
        run: |
          cd ordiseq_app
          npm run tauri build -- --target ${{ matrix.target }}

      - name: Build plugins
        run: |
          cargo run --package xtask --release -- bundle melody_player_plug --release --target ${{ matrix.target }}
          cargo run --package xtask --release -- bundle midi_inverter_plug --release --target ${{ matrix.target }}
          cargo run --package xtask --release -- bundle ordiseq_euclid_plug --release --target ${{ matrix.target }}

      - name: Package plugins (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}
          mkdir -p dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/{VST3,CLAP}
          cp target/bundled/melody_player_plug.clap dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/CLAP/
          cp target/bundled/midi_inverter_plug.clap dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/CLAP/
          cp target/bundled/ordiseq_euclid_plug.clap dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/CLAP/
          cp -r target/bundled/melody_player_plug.vst3 dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/VST3/
          cp -r target/bundled/midi_inverter_plug.vst3 dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/VST3/
          cp -r target/bundled/ordiseq_euclid_plug.vst3 dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/VST3/
          cp PLUGINS.md dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/README.md
          cd dist
          tar -czf ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}

      - name: Package plugins (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}
          mkdir -p dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/{VST3,CLAP}
          cp target/bundled/melody_player_plug.clap dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/CLAP/
          cp target/bundled/midi_inverter_plug.clap dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/CLAP/
          cp target/bundled/ordiseq_euclid_plug.clap dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/CLAP/
          cp -r target/bundled/melody_player_plug.vst3 dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/VST3/
          cp -r target/bundled/midi_inverter_plug.vst3 dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/VST3/
          cp -r target/bundled/ordiseq_euclid_plug.vst3 dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/VST3/
          cp PLUGINS.md dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/README.md
          cd dist
          7z a -tzip ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}.zip ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}

      - name: Package plugins (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}
          mkdir -p dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/{VST3,CLAP}
          cp -r target/bundled/melody_player_plug.clap dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/CLAP/
          cp -r target/bundled/midi_inverter_plug.clap dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/CLAP/
          cp -r target/bundled/ordiseq_euclid_plug.clap dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/CLAP/
          cp -r target/bundled/melody_player_plug.vst3 dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/VST3/
          cp -r target/bundled/midi_inverter_plug.vst3 dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/VST3/
          cp -r target/bundled/ordiseq_euclid_plug.vst3 dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/VST3/
          cp PLUGINS.md dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}/README.md
          cd dist
          tar -czf ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}

      # Upload Tauri app artifacts
      - name: Upload Linux app artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Upload Windows app artifacts
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Upload macOS app artifacts
        if: matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      # Upload plugin artifacts
      - name: Upload plugin artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz

      - name: Upload plugin artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}.zip

      - name: Upload plugin artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ordiseq-plugins-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz

  publish-crates:
    name: Publish to crates.io
    needs: build-app-and-plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        run: rustup toolchain install nightly

      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install cargo-workspaces
        run: cargo binstall --no-confirm cargo-workspaces

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo workspaces publish --from-git
